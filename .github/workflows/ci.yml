name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test Build Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # OIDC token for npm Trusted Publishers
    environment: ${{ github.event_name == 'workflow_dispatch' && 'npm' || '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}
          package-manager-cache: ${{ github.event_name != 'workflow_dispatch' }}

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publish to npm
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --access public
