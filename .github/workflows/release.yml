name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump'
        required: true
        type: choice
        options: [patch, minor, major, custom]
      custom_version:
        description: 'Exact version (only when "custom" is selected above, e.g. 1.0.0)'
        required: false
        type: string
      notes:
        description: 'Release notes (shown on the GitHub Release page, linked from npm)'
        required: true
        type: string

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write    # push version bump commit + tag, create GitHub Release
      id-token: write    # OIDC token for npm Trusted Publishers

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishers requires npm ≥ 11.5.1; Node 22 ships with npm 10.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # setup-node writes _authToken=${NODE_AUTH_TOKEN} into .npmrc.
      # With no token set, this empty value blocks OIDC Trusted Publishers.
      # Remove it so npm falls through to OIDC for authentication.
      - name: Clear auth token from npmrc
        run: npm config delete "//registry.npmjs.org/:_authToken"

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          if [ "${{ inputs.version }}" = "custom" ]; then
            npm version "${{ inputs.custom_version }}" --no-git-tag-version
          else
            npm version "${{ inputs.version }}" --no-git-tag-version
          fi

      - name: Read new version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - run: npm run build

      - name: Debug npm auth
        run: |
          echo "=== npm version ==="
          npm --version
          echo "=== npmrc ==="
          cat "$(npm config get userconfig)" || echo "(no userconfig)"
          echo "=== OIDC env vars ==="
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]   && echo "ACTIONS_ID_TOKEN_REQUEST_URL: SET"   || echo "ACTIONS_ID_TOKEN_REQUEST_URL: NOT SET"
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: SET" || echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: NOT SET"

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Commit and tag
        run: |
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.pkg.outputs.version }}"
          git tag "v${{ steps.pkg.outputs.version }}"
          git push --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.pkg.outputs.version }}" \
            --title "v${{ steps.pkg.outputs.version }}" \
            --notes "${{ inputs.notes }}"
